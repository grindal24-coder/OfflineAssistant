name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      # llama.cpp не хранится в репозитории — клонируется заново на каждой
      # сборке, версия закреплена на теге v0.3.0 (первый стабильный номерной
      # релиз llama.cpp, август 2026), чтобы API не "уезжал" из-под
      # native-lib.cpp. См. комментарий в начале native-lib.cpp, если
      # захочешь обновить версию.
      - name: Клонировать llama.cpp (закреплённая версия v0.3.0)
        run: |
          if [ ! -f "ai/llama.cpp/CMakeLists.txt" ]; then
            echo "ai/llama.cpp не найден — клонирую llama.cpp v0.3.0"
            git clone --branch v0.3.0 --depth 1 https://github.com/ggml-org/llama.cpp ai/llama.cpp
          else
            echo "ai/llama.cpp уже есть в репозитории, пропускаю клонирование"
          fi

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Официальный экшен от Gradle: сам скачивает и кэширует нужную версию
      # и кладёт бинарник `gradle` в PATH. Не требует ни gradlew, ни ручной
      # распаковки zip (та ручная схема ломалась — см. историю сборок).
      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Установить Android SDK / NDK / CMake
        uses: android-actions/setup-android@v3

      - name: Установить конкретную версию NDK
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Собрать debug APK
        run: gradle assembleDebug --stacktrace

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
