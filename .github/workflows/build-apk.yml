name: Build APK

# Запускается на каждый push в main и вручную из вкладки Actions ("Run workflow").
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория (включая submodules)
        uses: actions/checkout@v4
        with:
          # ВАЖНО: submodules: true подтягивает ai/llama.cpp, если ты его
          # подключил командой `git submodule add ...` и закоммитил.
          # Если submodule ещё не добавлен — сборка упадёт на шаге native
          # build с понятной ошибкой из CMakeLists.txt (см. README проекта,
          # раздел "Подключить llama.cpp").
          submodules: recursive

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Установить Android SDK / NDK / CMake
        uses: android-actions/setup-android@v3

      - name: Установить конкретную версию NDK
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Дать права на выполнение gradlew
        run: chmod +x ./gradlew

      - name: Собрать debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
